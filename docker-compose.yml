services:
  # Terminal 1 equivalent: MongoDB (Source: Port 27017) [1, 2]
  db:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # Terminal 2 equivalent: Backend (Source: Port 8000) [1, 2]
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - MONGODB_URL=mongodb://db:27017

  # Terminal 3 equivalent: Frontend (Source: Port 5173) [1, 2]
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

# This section was missing and caused your error
volumes:
  mongodb_data:
